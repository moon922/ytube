<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeVids Studio - 저작권 없는 유튜브 영상 모음집</title>
  <meta name="description" content="상업적 및 비상업적 이용이 가능한 유튜브 저작권 무료(Creative Commons, NCS, CC0) 고화질 영상 및 음원 큐레이션 웹앱">
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="#" class="logo-container">
      <div class="logo-icon">
        <i class="fas fa-play"></i>
      </div>
      <span class="logo-text">FreeVids Studio</span>
      <span class="logo-tag">Royalty-Free</span>
    </a>

    <!-- Search Box -->
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="영상 제목, 채널, 태그 (lofi, nature, ncs, space 등) 검색..." />
    </div>

    <!-- Actions -->
    <div class="nav-actions">
      <button class="btn-favorites" id="favoritesBtn" title="보관함 열기">
        <i class="fas fa-heart"></i>
        <span>즐겨찾기</span>
        <span class="fav-badge" id="favCountBadge">0</span>
      </button>

      <button class="btn-icon" id="themeToggleBtn" title="테마 전환">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-badge">
      <i class="fas fa-shield-check"></i> 100% 검증된 저작권 무료 & Creative Commons 영상
    </div>
    <h1 class="hero-title">
      콘텐츠 제작자를 위한<br>
      <span>저작권 무료 유튜브 영상 모음</span>
    </h1>
    <p class="hero-subtitle">
      유튜브 영상 제작, 스트리밍 라이브 배경, 공부용 Lofi 비트, 4K 자연 영상 및 VFX 그래픽을 자유롭게 찾아보세요.
    </p>
  </section>

  <!-- Category Filter Tabs -->
  <div class="categories-wrapper">
    <div class="category-tabs" id="categoryTabs">
      <button class="tab-btn active" data-category="all">
        <i class="fas fa-th-large"></i> 전체 보기
      </button>
      <button class="tab-btn" data-category="music">
        <i class="fas fa-music"></i> Lofi & 음악
      </button>
      <button class="tab-btn" data-category="nature">
        <i class="fas fa-tree"></i> 자연 & 힐링
      </button>
      <button class="tab-btn" data-category="tech">
        <i class="fas fa-microchip"></i> 테크 & Sci-Fi
      </button>
      <button class="tab-btn" data-category="backgrounds">
        <i class="fas fa-infinity"></i> 루프 배경 & VFX
      </button>
      <button class="tab-btn" data-category="cinematic">
        <i class="fas fa-film"></i> Open Movie & 4K
      </button>
    </div>
  </div>

  <!-- Main Container -->
  <main class="container">
    <div class="video-grid" id="videoGrid">
      <!-- Video Cards rendered dynamically via JS -->
    </div>
  </main>

  <!-- Player Modal -->
  <div class="modal-overlay" id="videoModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">영상 제목</h3>
        <button class="modal-close" id="modalCloseBtn" title="닫기">&times;</button>
      </div>

      <div class="player-wrapper">
        <iframe id="modalIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <div class="modal-info">
        <div class="modal-meta-row">
          <div id="modalChannel" style="font-weight: 600; color: var(--text-muted);">채널명</div>
          <div class="modal-actions">
            <a id="modalYtBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn-yt">
              <i class="fab fa-youtube"></i> YouTube에서 원본 보기
            </a>
          </div>
        </div>

        <div class="license-box">
          <h4><i class="fas fa-balance-scale"></i> 라이선스 & 사용 안내: <span id="modalLicenseTag">CC BY 3.0</span></h4>
          <p id="modalLicenseDetails">라이선스 설명 문구가 표시됩니다.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
